apiVersion: apps/v1
kind: Deployment
metadata: { name: snippet-app }
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: app
          image: snippet-manager:1.0
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /api/snippets/stats, port: 8080 } }